<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TailScreen" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <title>TailScreen</title>
  </head>
  <body>
    <main>
      <header class="topbar">
        <a class="brand" href="/">TailScreen</a>
        <button id="refreshButton" type="button">Rescan</button>
      </header>

      <section class="hero">
        <h1>Videos</h1>
        <p class="subtitle">Browse your server, play on this iPad, or launch a title on the server.</p>
      </section>

      <section class="toolbar" aria-label="Library controls">
        <label class="search">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Search your library" aria-label="Search your library" autocomplete="off" />
        </label>
        <div class="library-count" id="libraryCount" aria-live="polite">Connecting…</div>
      </section>

      <section class="media-grid" id="mediaGrid" aria-live="polite"></section>

      <section class="empty-state hidden" id="emptyState">
        <h2>No videos found</h2>
        <p id="emptyMessage">Add a library to <code>config.json</code>, then rescan.</p>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog id="playerDialog" aria-labelledby="playerTitle">
      <div class="player-header">
        <strong id="playerTitle"></strong>
        <button id="closePlayer" type="button" aria-label="Close player">Close</button>
      </div>
      <video id="videoPlayer" controls playsinline></video>
    </dialog>

    <template id="mediaCardTemplate">
      <article class="media-card">
        <div class="card-copy">
          <h2 class="media-title"><span class="format-badge"></span><span class="media-title-text"></span></h2>
          <p class="media-meta"></p>
        </div>
        <div class="card-actions">
          <button type="button" data-action="play-here">Play here</button>
          <button type="button" data-action="launch">Launch on server</button>
        </div>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
