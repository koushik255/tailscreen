<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Media" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css?v=13" />
    <title>Media</title>
  </head>
  <body>
    <main id="libraryView" class="library-view">
      <section class="toolbar" aria-label="Library controls">
        <input id="searchInput" type="search" placeholder="Search" aria-label="Search your library" autocomplete="off" />
        <div class="library-count" id="libraryCount" aria-live="polite">Connecting…</div>
      </section>

      <section class="media-grid" id="mediaGrid" aria-live="polite"></section>

      <section class="empty-state hidden" id="emptyState">
        <h2>No videos found</h2>
        <p id="emptyMessage">Add a library to <code>config.json</code> and reload this page.</p>
      </section>
    </main>

    <main id="playerView" class="player-view" aria-labelledby="playerTitle" hidden>
      <div class="player-header">
        <div class="player-heading">
          <button id="closePlayer" type="button" aria-label="Back to library">Back</button>
          <strong id="playerTitle"></strong>
        </div>
        <div class="player-actions">
          <button id="subtitleButton" type="button">Add subtitles</button>
          <input id="subtitleFile" type="file" accept=".srt,.ass,.ssa" hidden />
        </div>
      </div>
      <div class="player-content">
        <div class="player-surface">
          <video id="nativePlayer" controls playsinline hidden></video>
          <canvas id="playerCanvas" hidden></canvas>
          <div id="subtitleOverlay" class="subtitle-overlay" aria-live="off"></div>
        </div>
        <section id="compatibilityPlayer" class="compatibility-player" hidden>
          <p id="playerStatus" role="status">Preparing playback…</p>
          <div class="player-controls">
            <button id="togglePlayback" type="button" disabled>Play</button>
            <input id="seek" type="range" min="0" max="0" value="0" step="0.1" aria-label="Playback position" />
            <span id="playerTime">0:00 / 0:00</span>
            <label>Volume <input id="volume" type="range" min="0" max="1" value="1" step="0.05" /></label>
          </div>
        </section>
        <section class="clip-controls" aria-label="Create a clip">
          <label>Last <input id="clipDuration" type="number" min="1" max="60" step="1" value="15" inputmode="numeric" /> seconds</label>
          <button id="clipButton" type="button">Create clip</button>
          <span id="clipStatus" role="status"></span>
          <a id="clipLink" target="_blank" rel="noreferrer" hidden>Open clip</a>
        </section>
      </div>
    </main>

    <template id="mediaCardTemplate">
      <article class="media-card">
        <div class="card-copy">
          <h2 class="media-title"><span class="format-badge"></span><span class="media-title-text"></span></h2>
          <p class="media-meta"></p>
        </div>
        <button type="button">Play</button>
      </article>
    </template>

    <script type="module" src="/app.js?v=13"></script>
  </body>
</html>
